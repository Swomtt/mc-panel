<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#08090a">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src https://ntfy.sh http://127.0.0.1:* http://localhost:*; base-uri 'none'; form-action 'none'">
<title>Minecraft server</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e1010'/%3E%3Cpath d='M32 13v20' fill='none' stroke='%23fff' stroke-width='6.5' stroke-linecap='round'/%3E%3Cpath d='M19.5 20.5a18.5 18.5 0 1 0 25 0' fill='none' stroke='%23fff' stroke-width='6.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #08090a; --panel: #0e1010; --line: #1d1f21; --input: #1b1c1e; --text: #f3f3f3; --muted: #a3a7ac;
  --green: #4ade80; --amber: #fbbf24; --red: #f87171; --blue: #8ab8ff;
  --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text); font: 15px/1.45 var(--font);
  display: grid; place-items: center; padding: 16px; -webkit-font-smoothing: antialiased;
}
main {
  width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--line); border-radius: 22px;
  padding: 30px 24px 26px; display: flex; flex-direction: column; align-items: center; text-align: center;
  box-shadow: 0 24px 60px rgba(0,0,0,.45);
}
h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .2px; overflow-wrap: anywhere; }
.lead { color: var(--muted); font-size: 14px; margin: 8px 0 18px; }
form { width: 100%; display: flex; flex-direction: column; gap: 10px; }
input {
  width: 100%; height: 46px; border-radius: 12px; border: 1px solid #2b2d30; background: var(--input); color: var(--text);
  padding: 0 14px; font: inherit; font-size: 16px; outline: none; transition: border-color .15s;
}
input:focus { border-color: #4b4f55; }
.go {
  height: 46px; border: 0; border-radius: 12px; background: #f3f3f3; color: #0b0c0d; font: inherit; font-weight: 600;
  cursor: pointer; transition: opacity .15s, transform .1s;
}
.go:active { transform: scale(.98); }
.go:disabled { opacity: .5; cursor: default; }
.msg { min-height: 20px; font-size: 13px; color: var(--muted); }
.msg.error { color: var(--red); }
.power {
  width: 168px; height: 168px; margin: 18px 0 6px; border-radius: 50%; border: 0; background: transparent; color: #fff;
  display: grid; place-items: center; position: relative; cursor: pointer;
  transition: transform .15s ease, color .3s; -webkit-tap-highlight-color: transparent;
}
.power svg { width: 128px; height: 128px; transition: filter .3s; }
.power::before {
  content: ""; position: absolute; inset: 8px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.08), transparent 70%); opacity: 0; transition: opacity .2s;
}
.power:not(:disabled):hover::before { opacity: 1; }
.power:not(:disabled):hover { transform: scale(1.03); }
.power:not(:disabled):active { transform: scale(.96); }
.power:focus-visible { outline: 2px solid var(--blue); outline-offset: 4px; }
.power:disabled { cursor: default; }
.power.online { color: var(--green); }
.power.online svg { filter: drop-shadow(0 0 18px rgba(74,222,128,.55)); }
.power.starting, .power.stopping { color: var(--amber); }
.power.starting svg, .power.stopping svg { animation: pulse 1.3s ease-in-out infinite; filter: drop-shadow(0 0 16px rgba(251,191,36,.45)); }
.power.checking, .power.unreachable, .power.closed, .power.noconn { opacity: .3; }
@keyframes pulse { 50% { opacity: .35; } }
.status { font-weight: 600; font-size: 16px; letter-spacing: .2px; min-height: 23px; }
.status.online { color: var(--green); }
.status.starting, .status.stopping { color: var(--amber); }
.status.unreachable, .status.closed, .status.noconn, .status.checking { color: var(--muted); }
.hint { margin-top: 4px; font-size: 13px; color: var(--muted); min-height: 38px; max-width: 300px; }
.hint.error { color: var(--red); }
@media (prefers-reduced-motion: reduce) { .power, .power svg { transition: none; animation: none !important; } }
</style>
</head>
<body>
<main>
  <h1 id="name">Minecraft server</h1>

  <p class="lead" id="nocode" hidden></p>

  <form id="login" hidden autocomplete="on">
    <p class="lead" id="loginLead" style="margin-bottom:8px"></p>
    <input type="text" name="username" autocomplete="username" value="mc-panel" hidden aria-hidden="true">
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="go" id="go" type="submit"></button>
    <div class="msg" id="loginMsg" role="status" aria-live="polite"></div>
  </form>

  <section id="panel" hidden style="display:flex;flex-direction:column;align-items:center">
    <button class="power checking" id="power" type="button" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2.8v8.4" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M6.7 6.1a7.9 7.9 0 1 0 10.6 0" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="status" id="status" role="status" aria-live="polite">&nbsp;</div>
    <div class="hint" id="hint"></div>
  </section>
</main>

<script>
'use strict';
/* MC Panel start button. This page and MC Panel (on the host's PC) talk through
   ntfy.sh, a free public message service. Messages are signed with a key made
   from the password; the password itself never leaves this page. */
(function () {
  // ---------- language ----------
  const PT = (navigator.language || '').toLowerCase().startsWith('pt');
  document.documentElement.lang = PT ? 'pt-BR' : 'en';
  const T = {
    'Minecraft server': 'Servidor de Minecraft',
    'This page needs the link from MC Panel. Ask the person who hosts the server to send it to you (MC Panel → Settings → Website).': 'Esta página precisa do link do MC Panel. Peça para quem hospeda o servidor te mandar o link (MC Panel → Configurações → Site).',
    'Type the password to use the start button. You only need to do this once on this device.': 'Digite a senha para usar o botão de ligar. Você só precisa fazer isso uma vez neste aparelho.',
    'The password was changed. Type the new one.': 'A senha mudou. Digite a nova.',
    'Password': 'Senha',
    'Continue': 'Continuar',
    'Checking…': 'Verificando…',
    'Wrong password.': 'Senha errada.',
    'MC Panel isn’t answering, so the password can’t be checked right now. Make sure MC Panel is open on the host’s PC and try again.': 'O MC Panel não está respondendo, então não dá para conferir a senha agora. Veja se o MC Panel está aberto no PC de quem hospeda e tente de novo.',
    'Can’t connect. Check your internet connection.': 'Não deu para conectar. Confira sua internet.',
    'Turn the server on': 'Ligar o servidor',
    'Connecting…': 'Conectando…',
    'Offline': 'Desligado',
    'Press the button to turn the server on.': 'Aperte o botão para ligar o servidor.',
    'Starting…': 'Ligando…',
    'This usually takes about a minute.': 'Costuma levar mais ou menos um minuto.',
    'Online': 'Online',
    'The server is on. 1 person is playing.': 'O servidor está ligado. 1 pessoa está jogando.',
    'The server is on. {n} people are playing.': 'O servidor está ligado. {n} pessoas estão jogando.',
    'The server is on. Nobody is playing yet: it turns off by itself in {m} min if nobody joins.': 'O servidor está ligado. Ninguém está jogando ainda: ele desliga sozinho em {m} min se ninguém entrar.',
    'The server is on. Nobody is playing yet: it turns off by itself in less than a minute if nobody joins.': 'O servidor está ligado. Ninguém está jogando ainda: ele desliga sozinho em menos de um minuto se ninguém entrar.',
    'The server is on. See you in the game!': 'O servidor está ligado. Te vejo no jogo!',
    'Stopping…': 'Desligando…',
    'Wait until it’s off to turn it on again.': 'Espere desligar para ligar de novo.',
    'MC Panel is closed': 'O MC Panel está fechado',
    'Ask the host to open MC Panel on their PC.': 'Peça para quem hospeda abrir o MC Panel no PC.',
    'MC Panel isn’t answering': 'O MC Panel não está respondendo',
    'The host’s PC may be off, or MC Panel is closed. Trying again…': 'O PC de quem hospeda pode estar desligado, ou o MC Panel está fechado. Tentando de novo…',
    'Can’t connect': 'Não deu para conectar',
    'Check your internet connection. Trying again…': 'Confira sua internet. Tentando de novo…',
    'The server couldn’t start. Ask the person who hosts it to check MC Panel.': 'O servidor não conseguiu ligar. Peça para quem hospeda conferir o MC Panel.',
  };
  const t = (s, v) => (PT && T[s] ? T[s] : s).replace(/\{(\w+)\}/g, (_, k) => (v && v[k] != null ? v[k] : ''));
  const serverName = (n) => {
    if (!n) return t('Minecraft server');
    const m = PT && /^(.+)'s server$/.exec(n);
    return m ? 'Servidor de ' + m[1] : n;
  };
  const hostText = (s) => t(String(s).replace(/'/g, '’'));

  // ---------- setup ----------
  const NTFY = (() => {
    const q = new URLSearchParams(location.search).get('ntfy'); // local testing only
    if (q) {
      try {
        const u = new URL(q);
        if (u.hostname === '127.0.0.1' || u.hostname === 'localhost') return u.origin;
      } catch { /* ignore */ }
    }
    return 'https://ntfy.sh';
  })();
  const STORE = 'mcpanel.web';
  const load = () => { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch { return {}; } };
  const save = (v) => { try { localStorage.setItem(STORE, JSON.stringify(v)); } catch { /* private mode */ } };

  const $ = (id) => document.getElementById(id);
  const fromLink = (location.hash.slice(1).match(/^[a-z2-7]{22}$/) || [])[0];
  let saved = load();
  if (fromLink && saved.code !== fromLink) saved = { code: fromLink };
  const code = fromLink || saved.code;
  let key = saved.code === code ? saved.key || null : null;
  const topicURL = () => `${NTFY}/mcpanel_${code}`;

  // ---------- signing (same as MC Panel) ----------
  const enc = new TextEncoder();
  const hex = (buf) => Array.from(new Uint8Array(buf), (b) => b.toString(16).padStart(2, '0')).join('');
  const unhex = (h) => new Uint8Array(h.match(/../g).map((x) => parseInt(x, 16)));
  async function derive(pw) {
    const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode('mcpanel-web/' + code), iterations: 150000 }, base, 256);
    return hex(bits);
  }
  const hmacKeys = {};
  const hmacKey = (k) => (hmacKeys[k] = hmacKeys[k] || crypto.subtle.importKey('raw', unhex(k), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign', 'verify']));
  const sign = async (k, kind, d) => hex(await crypto.subtle.sign('HMAC', await hmacKey(k), enc.encode('mcpanel-web:' + kind + ':' + d)));
  const verify = async (k, kind, d, m) => /^[0-9a-f]{64}$/.test(m || '') && crypto.subtle.verify('HMAC', await hmacKey(k), unhex(m), enc.encode('mcpanel-web:' + kind + ':' + d));
  const nonce = () => hex(crypto.getRandomValues(new Uint8Array(12)));

  // ---------- talking to MC Panel through ntfy.sh ----------
  let es = null;
  let open = false;
  const openWaiters = [];
  const pending = new Map(); // nonce -> resolve

  function connect() {
    if (es) return;
    es = new EventSource(topicURL() + '/sse');
    es.onopen = () => { open = true; openWaiters.splice(0).forEach((f) => f(true)); };
    es.onerror = () => { open = false; };
    es.onmessage = (e) => { onMessage(e.data); };
  }
  function whenOpen(ms) {
    if (open) return Promise.resolve(true);
    return new Promise((res) => { openWaiters.push(res); setTimeout(() => res(open), ms); });
  }

  async function onMessage(data) {
    let ev, env, d;
    try { ev = JSON.parse(data); env = JSON.parse(ev.message); d = JSON.parse(env.d); } catch { return; }
    if (ev.event !== 'message' || env.v !== 1) return;
    if (env.k === 'x') { // wrong password (unsigned: give a real answer a moment to win)
      const done = pending.get(d.re);
      if (done) setTimeout(() => { if (pending.get(d.re) === done) { pending.delete(d.re); done({ denied: true }); } }, 800);
      return;
    }
    if (env.k !== 's' || !key || !(await verify(key, 's', env.d, env.m))) return;
    const done = d.re ? pending.get(d.re) : null;
    if (done) { pending.delete(d.re); done({ status: d }); }
    showStatus(d, !!done);
  }

  async function command(action, wait) {
    const n = nonce();
    const d = JSON.stringify({ a: action, n, ts: Date.now() });
    const body = JSON.stringify({ v: 1, k: 'c', d, m: await sign(key, 'c', d) });
    const result = new Promise((res) => {
      const timer = setTimeout(() => { pending.delete(n); res({ timeout: true }); }, wait);
      pending.set(n, (r) => { clearTimeout(timer); res(r); });
    });
    connect();
    if (!(await whenOpen(6000))) { pending.get(n)?.({ noconn: true }); pending.delete(n); return result; }
    try {
      const r = await fetch(topicURL(), { method: 'POST', body, cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
    } catch {
      const done = pending.get(n);
      if (done) { pending.delete(n); done({ noconn: true }); }
    }
    return result;
  }

  // ---------- the button ----------
  let state = 'checking';
  let players = 0;
  let offEnd = 0;
  let error = '';
  let lastHeard = 0;
  let busy = false;
  let timer = 0;

  function showStatus(d, mine) {
    state = ['offline', 'starting', 'online', 'stopping', 'closed'].includes(d.s) ? d.s : 'offline';
    players = d.p | 0;
    offEnd = d.off > 0 ? Date.now() + d.off * 1000 : 0;
    lastHeard = Date.now();
    if (mine || state !== 'offline') error = mine && d.err ? d.err : '';
    if (d.name) {
      saved.name = d.name;
      if (key && saved.key === key) save(saved);
      setName(d.name);
    }
    render();
    schedule();
  }

  function setName(n) {
    $('name').textContent = serverName(n);
    document.title = serverName(n);
  }

  function render() {
    const btn = $('power');
    let s = '', h = '';
    switch (state) {
      case 'checking': s = t('Connecting…'); break;
      case 'offline': s = t('Offline'); h = t('Press the button to turn the server on.'); break;
      case 'starting': s = t('Starting…'); h = t('This usually takes about a minute.'); break;
      case 'online':
        s = t('Online');
        if (players === 1) h = t('The server is on. 1 person is playing.');
        else if (players > 1) h = t('The server is on. {n} people are playing.', { n: players });
        else if (offEnd) {
          const secs = (offEnd - Date.now()) / 1000;
          const left = Math.round(secs / 60);
          h = secs >= 60 ? t('The server is on. Nobody is playing yet: it turns off by itself in {m} min if nobody joins.', { m: left })
            : t('The server is on. Nobody is playing yet: it turns off by itself in less than a minute if nobody joins.');
        } else h = t('The server is on. See you in the game!');
        break;
      case 'stopping': s = t('Stopping…'); h = t('Wait until it’s off to turn it on again.'); break;
      case 'closed': s = t('MC Panel is closed'); h = t('Ask the host to open MC Panel on their PC.'); break;
      case 'unreachable': s = t('MC Panel isn’t answering'); h = t('The host’s PC may be off, or MC Panel is closed. Trying again…'); break;
      case 'noconn': s = t('Can’t connect'); h = t('Check your internet connection. Trying again…'); break;
    }
    btn.className = 'power ' + state;
    btn.disabled = state !== 'offline' || busy;
    btn.setAttribute('aria-label', state === 'offline' ? t('Turn the server on') : s);
    btn.title = state === 'offline' ? t('Turn the server on') : '';
    $('status').className = 'status ' + state;
    $('status').textContent = s || ' ';
    $('hint').className = 'hint' + (error ? ' error' : '');
    $('hint').textContent = error ? hostText(error) : h;
  }

  // ask MC Panel how things are (when the page opens, comes back, or now and then)
  async function hello() {
    if (!key || busy) return;
    const r = await command('hello', 9000);
    if (r.denied) return passwordChanged();
    if (r.timeout) state = 'unreachable';
    if (r.noconn) state = 'noconn';
    if (!r.status) { render(); schedule(); }
  }

  function schedule() {
    clearTimeout(timer);
    if (document.hidden || !key) return;
    const quick = ['unreachable', 'noconn', 'closed', 'checking'].includes(state);
    timer = setTimeout(hello, quick ? 20000 : 5 * 60000);
  }

  $('power').addEventListener('click', async () => {
    if (state !== 'offline' || busy) return;
    busy = true;
    error = '';
    state = 'starting'; // show it right away
    render();
    const r = await command('start', 12000);
    busy = false;
    if (r.denied) return passwordChanged();
    if (r.timeout) state = 'unreachable';
    if (r.noconn) state = 'noconn';
    render();
    schedule();
  });

  setInterval(() => { if (state === 'online' && offEnd && !players) render(); }, 15000);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { clearTimeout(timer); return; }
    if (key && !busy && Date.now() - lastHeard > 30000) hello(); else schedule();
  });

  // ---------- password ----------
  function showLogin(message, isError) {
    key = null;
    $('panel').hidden = true;
    $('login').hidden = false;
    $('loginLead').textContent = t('Type the password to use the start button. You only need to do this once on this device.');
    $('pw').placeholder = t('Password');
    $('pw').setAttribute('aria-label', t('Password'));
    $('go').textContent = t('Continue');
    $('loginMsg').textContent = message || '';
    $('loginMsg').className = 'msg' + (isError ? ' error' : '');
    setTimeout(() => $('pw').focus(), 50);
  }

  function passwordChanged() {
    saved = { code, name: saved.name };
    save(saved);
    showLogin(t('The password was changed. Type the new one.'), true);
  }

  function showPanel() {
    $('login').hidden = true;
    $('panel').hidden = false;
    render();
  }

  $('login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = $('pw').value;
    if (!pw) return;
    $('go').disabled = true;
    $('loginMsg').className = 'msg';
    $('loginMsg').textContent = t('Checking…');
    key = await derive(pw);
    const r = await command('hello', 10000);
    $('go').disabled = false;
    if (r.status) {
      saved = { code, key, name: r.status.name || saved.name };
      save(saved);
      $('pw').value = '';
      showPanel();
      showStatus(r.status, true);
      return;
    }
    key = null;
    $('loginMsg').className = 'msg error';
    $('loginMsg').textContent = r.denied ? t('Wrong password.')
      : r.noconn ? t('Can’t connect. Check your internet connection.')
      : t('MC Panel isn’t answering, so the password can’t be checked right now. Make sure MC Panel is open on the host’s PC and try again.');
    if (r.denied) { $('pw').select(); }
  });

  // ---------- start ----------
  window.addEventListener('hashchange', () => location.reload()); // a new link was opened
  setName(saved.code === code ? saved.name : '');
  if (!code) {
    $('nocode').hidden = false;
    $('nocode').textContent = t('This page needs the link from MC Panel. Ask the person who hosts the server to send it to you (MC Panel → Settings → Website).');
  } else if (!key) {
    showLogin();
  } else {
    showPanel();
    hello();
  }
})();
</script>
</body>
</html>
